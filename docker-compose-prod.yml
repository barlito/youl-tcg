services:
    php:
        image: barlito/youl-tcg:${TAG}
        volumes:
            - ytcg_caddy_data:/data
            - ytcg_public_data:/app/public/images
        environment:
            DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@ytcg_db:5432/ytcg?serverVersion=13&charset=utf8"
            JWT_PUBLIC_KEY: "${JWT_PUBLIC_KEY}"
            JWT_SECRET_KEY: "${JWT_SECRET_KEY}"
            JWT_PASSPHRASE: "${JWT_PASSPHRASE}"
        tty: true
        deploy:
            labels:
                - traefik.enable=true

                - traefik.http.services.ytcg.loadbalancer.server.port=80

                - traefik.http.routers.ytcg.rule=Host(`ytcg.barlito.fr`)
                - traefik.http.routers.ytcg.entrypoints=http

                - traefik.http.routers.ytcg-secure.rule=Host(`ytcg.barlito.fr`)
                - traefik.http.routers.ytcg-secure.entrypoints=https
                - traefik.http.routers.ytcg-secure.tls=true
                - traefik.http.routers.ytcg-secure.tls.certresolver=letsencrypt
        networks:
            - traefik_traefik_proxy
            - ytcg_internal

    db:
        image: postgres:13
        environment:
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ytcg
        volumes:
            - ytcg_db_data:/var/lib/postgresql/data:rw
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U postgres"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - ytcg_internal

    adminer:
        image: adminer
        deploy:
            labels:
                - traefik.enable=true

                - traefik.http.services.ytcg_adminer.loadbalancer.server.port=8080

                - traefik.http.routers.ytcg_adminer.rule=Host(`ytcg-adminer.barlito.fr`)
                - traefik.http.routers.ytcg_adminer.entrypoints=http

                - traefik.http.routers.ytcg_adminer-secure.rule=Host(`ytcg-adminer.barlito.fr`)
                - traefik.http.routers.ytcg_adminer-secure.entrypoints=https
                - traefik.http.routers.ytcg_adminer-secure.tls=true
        networks:
            - ytcg_internal
            - traefik_traefik_proxy

volumes:
    ytcg_db_data:
    ytcg_caddy_data:
    ytcg_public_data:

networks:
    traefik_traefik_proxy:
        external: true
    ytcg_internal:
        driver: overlay
