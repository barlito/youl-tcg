name: rollback

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to roll back to (e.g. v1.2.0)
        type: string
        required: true
      restore-database:
        description: Restore the dump taken while the target tag was running, instead of reverting the migrations added since
        type: boolean
        default: false

permissions: {}

jobs:
  rollback:
    permissions:
      contents: read
      deployments: write
    uses: barlito/ci/.github/workflows/swarm-rollback.yaml@v1
    with:
      tag: ${{ inputs.tag }}
      restore: ${{ inputs.restore-database && '1' || '' }}
      images: barlito/youl-tcg
      castor: true
    secrets: inherit
