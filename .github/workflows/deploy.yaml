name: deploy

on:
  workflow_dispatch:
    inputs:
      re-deploy:
        description: Full stack deploy (applies all of docker-compose-prod.yml, rolling update with rollback) instead of the image update only
        type: boolean
        default: false

permissions: {}

jobs:
  deploy:
    permissions:
      contents: read
      deployments: write
    uses: barlito/ci/.github/workflows/swarm-deploy.yaml@v1
    with:
      full: ${{ inputs.re-deploy }}
      images: barlito/youl-tcg
      env-secrets: APP_SECRET DB_USER DB_PASSWORD JWT_PUBLIC_KEY JWT_SECRET_KEY JWT_PASSPHRASE MERCURE_JWT_SECRET YOUL_COIN_API_KEY YTCG_WEBHOOK_SECRET
      castor: true
    secrets: inherit
