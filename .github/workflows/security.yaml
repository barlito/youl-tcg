name: security

on:
  push:
    paths:
      - .docker/**
      - docker-compose*.yml
      - composer.lock
      - .github/workflows/security.yaml
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions: {}

jobs:
  image-scan:
    permissions:
      contents: read
      security-events: write
    uses: barlito/ci/.github/workflows/image-scan.yaml@v1
    with:
      dockerfile: .docker/Dockerfile
      target: frankenphp_prod
      fail-on-findings: true
    secrets: inherit
