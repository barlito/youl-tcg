expose_php = 0
date.timezone = UTC
apc.enable_cli = 1
session.use_strict_mode = 1
zend.detect_unicode = 0

; Admin batch upload (one card per artwork) — the PHP defaults kill the whole
; POST past the limit: post_max_size 8M drops the body at request startup
; (empty form on the Symfony side) and max_file_uploads SILENTLY ignores every
; file after the 20th. Caddy does not cap the body, PHP is the only limit.
upload_max_filesize = 24M
post_max_size = 256M
max_file_uploads = 100

; Compiling the whole Twig set (EasyAdmin ships a lot of templates) peaks just
; above the 128M default, so a cold cache:clear dies mid-warmup — in CI it took
; down the build. The web request path never gets close to this.
memory_limit = 512M

; https://symfony.com/doc/current/performance.html
realpath_cache_size = 4096K
realpath_cache_ttl = 600
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.memory_consumption = 256
opcache.enable_file_override = 1