<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Original brushed-metal foil: horizontally stretched noise (low X freq, high Y
       freq) desaturated to grey streaks. Blend with color-dodge / soft-light. -->
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="0.5" stop-color="#c8c8c8"/>
      <stop offset="1" stop-color="#3a3a3a"/>
    </linearGradient>
    <filter id="brush" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.9" numOctaves="2" seed="5" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g">
        <feFuncA type="linear" slope="0.5" intercept="0"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="256" height="256" fill="url(#sheen)"/>
  <rect width="256" height="256" filter="url(#brush)"/>
</svg>
