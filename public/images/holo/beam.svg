<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20" preserveAspectRatio="none">
  <!-- One vertical "beam" period: a bright silvery pillar with faint prismatic
       edges on black (black = no-op under color-dodge). Tile it tight via
       background-size to get a dense vertical-beam holo (rare-holo vibe), NOT a
       wide rainbow. Original / procedural. -->
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.34" stop-color="#000000"/>
      <stop offset="0.46" stop-color="#76e8ff"/>
      <stop offset="0.54" stop-color="#ffffff"/>
      <stop offset="0.62" stop-color="#ff9fe6"/>
      <stop offset="0.78" stop-color="#000000"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
  </defs>
  <rect width="20" height="20" fill="url(#beam)"/>
</svg>
