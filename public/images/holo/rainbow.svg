<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Original diagonal spectrum foil (repeats seamlessly along the 45° axis). -->
  <defs>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="1" spreadMethod="repeat" gradientUnits="objectBoundingBox">
      <stop offset="0.00" stop-color="#ff5d6c"/>
      <stop offset="0.17" stop-color="#ffd166"/>
      <stop offset="0.34" stop-color="#8aff80"/>
      <stop offset="0.50" stop-color="#7df0ff"/>
      <stop offset="0.67" stop-color="#7d9bff"/>
      <stop offset="0.84" stop-color="#d18aff"/>
      <stop offset="1.00" stop-color="#ff5d6c"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" fill="url(#spectrum)"/>
</svg>
