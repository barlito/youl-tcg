<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" preserveAspectRatio="xMidYMid slice">
  <!-- Original radial "burst" foil (V-Max / V-Star vibe): bright prismatic rays +
       central glow on black (black = no-op under color-dodge, so the artwork shows
       through; only the rays/glow brighten). -->
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.4" stop-color="#cfe9ff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="200" height="200" fill="#000000"/>
  <g>
    <rect x="97" y="0" width="6" height="200" fill="#ffffff" opacity="0.85"/>
    <rect x="97" y="0" width="6" height="200" fill="#ffffff" opacity="0.7" transform="rotate(90 100 100)"/>
    <rect x="97.5" y="0" width="5" height="200" fill="#76e8ff" opacity="0.7" transform="rotate(45 100 100)"/>
    <rect x="97.5" y="0" width="5" height="200" fill="#ff9fe6" opacity="0.7" transform="rotate(135 100 100)"/>
    <rect x="98.5" y="0" width="3" height="200" fill="#ffffff" opacity="0.45" transform="rotate(22.5 100 100)"/>
    <rect x="98.5" y="0" width="3" height="200" fill="#9fe7ff" opacity="0.45" transform="rotate(67.5 100 100)"/>
    <rect x="98.5" y="0" width="3" height="200" fill="#ffb3f0" opacity="0.45" transform="rotate(112.5 100 100)"/>
    <rect x="98.5" y="0" width="3" height="200" fill="#ffffff" opacity="0.45" transform="rotate(157.5 100 100)"/>
  </g>
  <circle cx="100" cy="100" r="100" fill="url(#core)"/>
</svg>
