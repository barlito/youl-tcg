<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" preserveAspectRatio="xMidYMid slice">
  <!-- Original radial "burst" foil (V-Max / V-Star vibe): silvery rays + central
       glow on black (black = no-op under color-dodge). The prismatic tint comes
       from the preset's gradient overlay + saturate. -->
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="200" height="200" fill="#000000"/>
  <g fill="#ffffff">
    <rect x="98" y="0" width="4" height="200" opacity="0.5"/>
    <rect x="98" y="0" width="4" height="200" opacity="0.4" transform="rotate(90 100 100)"/>
    <rect x="98.5" y="0" width="3" height="200" opacity="0.32" transform="rotate(45 100 100)"/>
    <rect x="98.5" y="0" width="3" height="200" opacity="0.32" transform="rotate(135 100 100)"/>
    <rect x="99" y="0" width="2" height="200" opacity="0.22" transform="rotate(22.5 100 100)"/>
    <rect x="99" y="0" width="2" height="200" opacity="0.22" transform="rotate(67.5 100 100)"/>
    <rect x="99" y="0" width="2" height="200" opacity="0.22" transform="rotate(112.5 100 100)"/>
    <rect x="99" y="0" width="2" height="200" opacity="0.22" transform="rotate(157.5 100 100)"/>
  </g>
  <circle cx="100" cy="100" r="100" fill="url(#core)"/>
</svg>
