# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # Explicit alias: in dev the UnlimitedBoosterClaimQuota decorator also
    # implements the interface, which breaks the automatic alias. Pointing at
    # the decorated service id resolves to the decorator chain when present.
    App\Service\Booster\BoosterClaimQuotaInterface: '@App\Service\Booster\DailyBoosterClaimQuota'

when@test:
    services:
        _defaults:
            autowire: true
            autoconfigure: true

        # exposed for integration tests (would otherwise be inlined/removed)
        App\Service\Booster\BoosterOpeningService:
            public: true

        App\Service\Booster\BoosterCodeRedeemService:
            public: true

        App\Service\Booster\BoosterCodeGenerator:
            public: true

        App\Service\Recycle\RecycleService:
            public: true

        # Functional tests reset a player's code-attempt budget before running:
        # the limiter state is cached on disk and would otherwise carry over
        # from one test (and one run) to the next.
        test.limiter.booster_code_redeem:
            alias: 'limiter.booster_code_redeem'
            public: true
