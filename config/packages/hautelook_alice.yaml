# fixtures/shared : les joueurs, communs aux deux jeux.
# fixtures/dev    : catalogue de la prod + historique simulé (docs/dev-fixtures.md).
# fixtures/test   : un jeu minimal et stable — la CI charge celui-ci, les tests
#                   s'appuient dessus, donc il ne grossit pas au gré des images.
when@dev:
    hautelook_alice:
        fixtures_path: [fixtures/shared, fixtures/dev]

when@test:
    hautelook_alice:
        fixtures_path: [fixtures/shared, fixtures/test]
