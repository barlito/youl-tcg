# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    #csrf_protection: true

    # Trust the Traefik reverse proxy (it terminates TLS and forwards over HTTP):
    # resolve the real client IP + original scheme from the X-Forwarded-* headers.
    trusted_proxies: '127.0.0.1,REMOTE_ADDR'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port']

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    # Realtime and the Youl Coin are best effort: a slow peer must not hold
    # the business request for the 60s default.
    http_client:
        default_options:
            timeout: 2
            max_duration: 3
        scoped_clients:
            youl_coin.client:
                base_uri: '%env(YOUL_COIN_API_URL)%'
                auth_bearer: '%env(YOUL_COIN_API_KEY)%'

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        http_client:
            mock_response_factory: App\Tests\Support\CoinMockResponses
        session:
            storage_factory_id: session.storage.factory.mock_file
