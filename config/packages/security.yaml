security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\DiscordUser
                property: discordId
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        webhooks:
            pattern: ^/webhooks/
            security: false
        api_admin:
            pattern: ^/api/admin
            stateless: true
            custom_authenticators:
                - App\Security\AdminApiAuthenticator
        # game server only (bearer DUEL_SERVER_TOKEN); the player duel API stays on main (JWT cookie)
        duel_server:
            pattern: ^/api/duel/server/
            stateless: true
            custom_authenticators:
                - App\Security\DuelServerAuthenticator
        main:
            stateless: true
            jwt: ~
            logout:
                path: app_logout
                target: '%env(LOGOUT_URL)%'

            # activate different ways to authenticate
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        - { path: ^/webhooks/, roles: PUBLIC_ACCESS }
        - { path: ^/api/admin/stats, roles: ROLE_STATS_API }
        - { path: '^/api/admin/(cards|boosters|settings|features)(/|$)', roles: ROLE_MANAGE_API }
        - { path: '^/api/admin/extensions/[^/]+(/(files|publish|banners))?$', roles: ROLE_MANAGE_API }
        - { path: ^/api/admin, roles: ROLE_IMPORT_API }
        - { path: ^/api/duel/server/, roles: ROLE_DUEL_SERVER }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/, roles: ROLE_USER }
